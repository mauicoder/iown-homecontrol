[env:lilygo_t3_v16]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
; --- Uncomment and replace with the actual port of your LilyGo T3 ---
; upload_port = /dev/cu.usbserial-YYYYY
; monitor_port = /dev/cu.usbserial-YYYYY
board_build.partitions = huge_app.csv
lib_archive = false
build_type = release
; Pass a global define to tell our code we are compiling for the LilyGO
build_flags =
  -D LILYGO_T3_V16
lib_deps =
  jgromes/RadioLib@^7.6.0
  olikraus/U8g2@^2.35.30
  knolleary/PubSubClient@^2.8

