[env:heltec_wifi_lora_32_V3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Force libraries to be recompiled from source, ignoring pre-compiled archives.
; This helps ensure build flags are always applied correctly.
lib_archive = false
; Use debug build type to prevent NDEBUG from being defined, which can
; disable Serial output within libraries like RadioLib.
build_type = debug
; Use a specific, stable version of RadioLib from the PlatformIO registry.
; This is more reliable than using the latest commit from GitHub.
lib_deps =
  jgromes/RadioLib@^7.6.0
  olikraus/U8g2@^2.35.30
; Use build_flags to apply flags to the build environment. These flags
; are specific to RadioLib and enable its debug/verbose output.


[env:heltec_wifi_lora_32_V3_debug]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Force libraries to be recompiled from source, ignoring pre-compiled archives.
; This helps ensure build flags are always applied correctly.
lib_archive = false
; Use debug build type to prevent NDEBUG from being defined, which can
; disable Serial output within libraries like RadioLib.
build_type = debug
; Use a specific, stable version of RadioLib from the PlatformIO registry.
; This is more reliable than using the latest commit from GitHub.
lib_deps =
  jgromes/RadioLib@^7.6.0
  olikraus/U8g2@^2.35.30
; Use build_flags to apply flags to the build environment. These flags
; are specific to RadioLib and enable its debug/verbose output.
build_flags =
  ; Enable basic debug output from RadioLib
  -D RADIOLIB_DEBUG=1
  ; Enable detailed output for FSK/GFSK packet structure
  -D RADIOLIB_DEBUG_PROTOCOL=1
  ; Enable detailed output for the SX126x series chip
  -D RADIOLIB_DEBUG_SX126X=1
  -D RADIOLIB_DEBUG_PORT=Serial
